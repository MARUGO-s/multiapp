name: Check Google authentication
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          VITE_QR_GOOGLE_AUTH_ENABLED: "true"
          VITE_PORTAL_GOOGLE_AUTH_ENABLED: "true"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/marugo-accounts/deno.json supabase/functions/marugo-accounts/index.ts
      - run: deno test --allow-env --config supabase/functions/marugo-accounts/deno.json tests/cloud-accounts.test.ts
      - run: deno check --config supabase/functions/kotonoha-api/deno.json supabase/functions/kotonoha-api/index.ts
      - run: deno test --allow-env --config supabase/functions/kotonoha-api/deno.json tests/cloud-google-auth.test.ts tests/cloud-api.test.ts
