name: Deploy kotonoha to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  offline-browser:
    uses: ./.github/workflows/offline-browser.yml
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run check
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_QR_GOOGLE_AUTH_ENABLED: ${{ vars.QR_GOOGLE_AUTH_ENABLED }}
          VITE_PORTAL_GOOGLE_AUTH_ENABLED: ${{ vars.PORTAL_GOOGLE_AUTH_ENABLED }}
      - run: node scripts/write-html-cards.mjs dist
        env:
          QR_HTML_CARDS_URL: https://hjhkccbktkscwtgzxjfq.supabase.co/functions/v1/marugo-qr/html-cards
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/marugo-directory/index.ts
      - run: deno test --allow-env tests/cloud-directory.test.ts
      - run: deno check --config supabase/functions/kotonoha-api/deno.json supabase/functions/kotonoha-api/index.ts
      - run: deno test --allow-env --allow-read --config supabase/functions/kotonoha-api/deno.json tests/cloud-api.test.ts tests/cloud-offline-upload.test.ts
      - run: deno test --allow-env --config supabase/functions/kotonoha-api/deno.json tests/cloud-google-auth.test.ts
      - run: deno test --allow-env --config supabase/functions/kotonoha-api/deno.json tests/cloud-tick.test.ts
      - run: deno check --config supabase/functions/marugo-qr/deno.json supabase/functions/marugo-qr/index.ts
      - run: deno test --allow-env --config supabase/functions/marugo-qr/deno.json tests/cloud-qr.test.ts tests/cloud-qr-files.test.ts tests/cloud-qr-logos.test.ts tests/cloud-qr-store-logos.test.ts tests/cloud-qr-catalog-compat.test.ts tests/cloud-qr-store-name.test.ts tests/cloud-domain-target.test.ts
      - run: deno test --allow-env --config supabase/functions/kotonoha-api/deno.json tests/cloud-custom-domain.test.ts
      - run: deno check --config supabase/functions/marugo-accounts/deno.json supabase/functions/marugo-accounts/index.ts
      - run: deno test --allow-env --config supabase/functions/marugo-accounts/deno.json tests/cloud-accounts.test.ts tests/cloud-shared-qr.test.ts
      - run: deno test --allow-env --config supabase/functions/kotonoha-api/deno.json tests/cloud-bot.test.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: [build, offline-browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
