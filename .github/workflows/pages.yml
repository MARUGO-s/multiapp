name: Deploy kotonoha to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_QR_GOOGLE_AUTH_ENABLED: ${{ vars.QR_GOOGLE_AUTH_ENABLED }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/kotonoha-api/deno.json supabase/functions/kotonoha-api/index.ts
      - run: deno test --allow-env --config supabase/functions/kotonoha-api/deno.json tests/cloud-api.test.ts
      - run: deno test --allow-env --config supabase/functions/kotonoha-api/deno.json tests/cloud-tick.test.ts
      - run: deno check --config supabase/functions/marugo-qr/deno.json supabase/functions/marugo-qr/index.ts
      - run: deno test --allow-env --config supabase/functions/marugo-qr/deno.json tests/cloud-qr.test.ts tests/cloud-qr-files.test.ts
      - run: deno check --config supabase/functions/marugo-accounts/deno.json supabase/functions/marugo-accounts/index.ts
      - run: deno test --allow-env --config supabase/functions/marugo-accounts/deno.json tests/cloud-accounts.test.ts
      - run: deno test --allow-env --config supabase/functions/kotonoha-api/deno.json tests/cloud-bot.test.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
